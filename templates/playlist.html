{% extends 'base.html' %}{% block content %}<div style="padding:30px;background:linear-gradient(#ff000044,#121212);display:flex;gap:20px;align-items:end"><img src="https://via.placeholder.com/180/FF0000/FFFFFF?text={{playlist.name}}" style="width:180px;height:180px"><div><p>Playlist</p><h1 style="font-size:40px">{{playlist.name}}</h1><p>{{playlist.desc}}</p></div></div><div class="section">{% for s in songs %}<div class="song-row" onclick="playSong('{{s.file}}','{{s.title}}','{{s.artist}}')"><span style="color:#b3b3b3;width:20px">{{loop.index}}</span><img src="https://via.placeholder.com/100"><div><b>{{s.title}}</b><br><small>{{s.artist}}</small></div></div>{% endfor %}</div>{% endblock %}
