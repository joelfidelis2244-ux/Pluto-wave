{% extends 'base.html' %}{% block content %}<div class="section" style="max-width:500px;margin:auto;background:#181818;padding:25px;border-radius:10px;border:1px solid #ff0000"><h2 style="color:#ff0000">Upload Wave</h2><br><form method="POST" enctype="multipart/form-data"><input style="width:100%;padding:12px;margin:8px 0;background:#242424;border:none;color:white;border-radius:5px" type="text" name="title" placeholder="Song Title" required><input style="width:100%;padding:12px;margin:8px 0;background:#242424;border:none;color:white;border-radius:5px" type="text" name="artist" placeholder="Artist" required><label>Music file</label><input style="width:100%;padding:12px;margin:8px 0;background:#242424;border:none;color:white;border-radius:5px" type="file" name="music" accept="audio/*"><label>Cover</label><input style="width:100%;padding:12px;margin:8px 0;background:#242424;border:none;color:white;border-radius:5px" type="file" name="cover" accept="image/*"><button class="btn" style="width:100%;margin-top:10px;padding:12px" type="submit">Add To Library</button></form></div>{% endblock %}
