{% extends 'base.html' %}{% block content %}<div class="section"><form><input class="search-box" name="q" placeholder="What do you want to play?"></form><br><h3>Browse</h3><div class="cards"><div class="card" style="background:#E13300"><h2>Afrobeat</h2></div><div class="card" style="background:#1E3264"><h2>Hip Hop</h2></div><div class="card" style="background:#8D67AB"><h2>Chill</h2></div></div><h3 style="margin-top:20px">Songs</h3>{% for s in songs %}<div class="song-row" onclick="playSong('{{s.file}}','{{s.title}}','{{s.artist}}')"><img src="https://via.placeholder.com/100"><div><b>{{s.title}}</b><br><small>{{s.artist}}</small></div></div>{% endfor %}</div>{% endblock %}
