{% extends 'base.html' %}{% block content %}<div class="section"><h2>Your Library</h2><div class="cards">{% for p in playlists %}<div class="card"><img src="https://via.placeholder.com/150/FF0000/FFFFFF?text={{p.name}}"><h4>{{p.name}}</h4><p>By Pluto</p></div>{% endfor %}</div><h3 style="margin-top:20px">Liked</h3>{% for s in songs %}<div class="song-row"><img src="https://via.placeholder.com/100"><div><b>{{s.title}}</b><br><small>{{s.artist}}</small></div></div>{% endfor %}</div>{% endblock %}
