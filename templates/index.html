{% extends 'base.html' %}{% block content %}<div class="section"><h2>Good evening</h2><div class="cards">{% for p in playlists %}<div class="card" onclick="location.href='/playlist/{{p.id}}'"><img src="https://via.placeholder.com/150/FF0000/FFFFFF?text={{p.name}}"><h4>{{p.name}}</h4><p>{{p.desc}}</p></div>{% endfor %}</div></div><div class="section"><h2>Popular Artists</h2><div class="cards">{% for a in artists %}<div class="card" onclick="location.href='/artist/{{a.id}}'"><img src="https://via.placeholder.com/150/111/FF0000?text={{a.name}}" style="border-radius:50%"><h4>{{a.name}}</h4><p>Artist</p></div>{% endfor %}</div></div><div class="section"><h2>Trending Now</h2>{% for s in songs %}<div class="song-row" onclick="playSong('{{s.file}}','{{s.title}}','{{s.artist}}')"><img src="https://via.placeholder.com/100"><div><b>{{s.title}}</b><br><small>{{s.artist}}</small></div></div>{% endfor %}</div>{% endblock %}
