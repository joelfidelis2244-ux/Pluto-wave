{% extends 'base.html' %}{% block content %}<div style="padding:30px;background:linear-gradient(#ff000022,#121212);display:flex;gap:20px;align-items:end"><img src="https://via.placeholder.com/180/111/FF0000?text={{artist.name}}" style="border-radius:50%;width:180px;height:180px"><div><p>Artist</p><h1 style="font-size:40px">{{artist.name}}</h1></div></div><div class="section"><h3>Popular</h3>{% for s in songs %}<div class="song-row" onclick="playSong('{{s.file}}','{{s.title}}','{{s.artist}}')"><span style="color:#b3b3b3;width:20px">{{loop.index}}</span><img src="https://via.placeholder.com/100"><div><b>{{s.title}}</b><br><small>{{artist.name}}</small></div></div>{% endfor %}</div>{% endblock %}
