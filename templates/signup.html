<!DOCTYPE html><html><head><title>Sign Up - PLUTO WAVE</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{background:#000;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh}.box{background:#121212;padding:30px;border-radius:10px;width:350px;text-align:center;border:1px solid #222}input{width:100%;padding:12px;margin:8px 0;background:#242424;border:1px solid #333;color:white;border-radius:5px}.btn{width:100%;background:#ff0000;color:white;padding:12px;border:none;border-radius:25px;font-weight:bold;margin-top:10px}a{color:#ff0000;text-decoration:none}.error{background:#ff000033;color:#ff5555;padding:8px;border-radius:5px;margin:10px 0}</style></head><body><div class="box"><h1>PLUTO <span style="color:#ff0000">WAVE</span></h1><br><h3>Sign up with Gmail</h3>{% if error %}<div class="error">{{error}}</div>{% endif %}<form method="POST"><input type="email" name="email" placeholder="yourname@gmail.com" required><input type="password" name="password" placeholder="Create password" required><button class="btn">SIGN UP</button></form><p style="margin-top:15px;font-size:14px;color:#b3b3b3">Have account? <a href="/login">Log in</a></p></div></body></html>
