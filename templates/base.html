<!DOCTYPE html><html><head><title>PLUTO WAVE</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><div class="sidebar"><div class="logo">PLUTO <span>WAVE</span></div><div class="nav"><a href="/" class="{{ 'active' if page=='home' }}">Home</a><a href="/search" class="{{ 'active' if page=='search' }}">Search</a><a href="/library" class="{{ 'active' if page=='library' }}">Library</a></div><div class="library"><p style="color:#b3b3b3;font-size:12px">{{user}}</p><br><a href="/upload" style="color:white;text-decoration:none">+ Create</a><br><br><a href="/logout" style="color:#ff5555;text-decoration:none">Log out</a></div></div><div class="main"><div class="topbar"><div></div><a class="btn" href="/upload">Upload</a></div>{% block content %}{% endblock %}</div><div class="player"><div style="display:flex;gap:10px;align-items:center"><div style="width:50px;height:50px;background:#ff0000;border-radius:5px"></div><div><b id="p-title">Pluto Wave</b><br><small style="color:#b3b3b3" id="p-artist">Select song</small></div></div><audio id="mainAudio" controls style="width:300px"></audio></div><script>function playSong(f,t,a){document.getElementById('mainAudio').src='/static/music/'+f;document.getElementById('mainAudio').play();document.getElementById('p-title').innerText=t;document.getElementById('p-artist').innerText=a;}</script></body></html>
